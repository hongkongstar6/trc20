# Mainnet configuration example. Only the differences from configs/config.nile.yaml
# are commented; copy that file and apply these sections.
#
# Rollout order that this config assumes:
#   1. Nile with energy.mode=fixed / trx_burn to exercise the whole flow.
#   2. Mainnet with small amounts and one rental provider enabled.
#   3. Mainnet with both providers and energy.mode=cheapest.
#   4. auto_topup.enabled=true only after the topup audit trail looks right.
env: prod
network: mainnet

log:
    level: debug
    log_dir: "./log" #日志路径
    output_console: true #是否输出至控制台
    output_file: true #是否支持输出至文件

mysql_server:
    # docker compose 注入的 MYSQL_DSN 优先；默认值只在直接跑本机进程时生效。
    #dsn: "zhp01:Zhp1234%@tcp(43.153.210.204:11000)/pay?parseTime=true&loc=Local&charset=utf8mb4"
    dsn: "${MYSQL_DSN:-root:rootpw@tcp(127.0.0.1:3306)/wallet?parseTime=true&loc=Local&charset=utf8mb4}"
    max_open_conns: 64
    max_idle_conns: 64
    conn_max_lifetime: 30m

redis_server:
    addr: "${REDIS_ADDR:-127.0.0.1:6379}"
    password: "${REDIS_PASSWORD:-}"
    db: 0
    prefix: "wallet:nile"

api_server:
    listen: ":8080"
    hmac_secret: "${API_HMAC_SECRET}"
    # Mainnet must pin the business system egress IPs.
    allowed_ips:
        - "10.0.0.11"
        - "127.0.0.1"
    signature_skew: 5m
    nonce_ttl: 10m

sign_server:
    listen: ":8090"
    endpoint: "${SIGN_ENDPOINT:-http://127.0.0.1:8090}"
    token: "${SIGN_TOKEN}"
    # Production: the mnemonic should be injected by the secret manager, or
    # better, replaced by a KMS/HSM/Vault Transit backed signing key.
    mnemonic: "${WALLET_MNEMONIC}" #12个或24个助记词
    passphrase: "${WALLET_PASSPHRASE:-}" #口令
    tls:
        enabled: true
        cert_file: ./etc/wallet/tls/sign.crt
        key_file: ./etc/wallet/tls/sign.key
        ca_file: ./etc/wallet/tls/ca.crt
        server_name: sign.internal

chain: #扫块配置节点
    # FullNode first once it is ready; TronGrid stays as the failover.
    nodes:
        #- name: fullnode #自建节点
        #   type: fullnode
        #  endpoint: "https://api.trongrid.io" #"${FULLNODE_ENDPOINT}" #是波场（TRON）官方生态中最核心的 主网（Mainnet）区块链节点与数据服务接口
        #  priority: 1
        #  enabled: true
        #  timeout: 10s
        - name: trongrid
          type: trongrid
          endpoint: https://api.trongrid.io #是波场（TRON）官方生态中最核心的 主网（Mainnet）区块链节点与数据服务接口
          api_key: "${TRONGRID_API_KEY}"
          priority: 2
          enabled: true
          timeout: 10s
          qps: 10 # 免费 key 限速 15 次/秒，超过后整个 key 会被暂停几十秒
          burst: 5
    solidity_for_confirm: true
    retry_per_node: 2
    broadcast_timeout: 15s
    rate_limit_wait: 60s # 所有节点都被限流时，最多等待多久再报错

wallet:
    account_path: "m/44'/195'/0'/0" #TRON的币种编号是195,第一个0:主账户第几个,第二个0:收款,第三个0:第几个子账户，m/44'/60'/0'/0/0
    tokens:
        - symbol: USDT
          contract: TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t #mainnet USDT-TRC20 代币智能合约转账的地址
          decimals: 6
          enabled: true
    # 系统地址：withdraw 需要 hot_wallet 的 address+path，sweep 需要 finance_wallet
    hot_wallet:
        address: "${HOT_WALLET_ADDRESS}" #提现付款地址
        path: "m/44'/195'/1'/0/0"
    finance_wallet:
        address: "${FINANCE_WALLET_ADDRESS}" #归集收款地址
        path: "m/44'/195'/2'/0/0"
    gas_account:
        address: "${GAS_ACCOUNT_ADDRESS}"
        path: "m/44'/195'/3'/0/0"

deposit:
    start_block: 0 # 0 means start from the current head
    batch_blocks: 20 #
    fetch_concurrency: 8 # 一个区块要两次 RPC，串行扫块追不上出块速度
    confirmations: 19 # TRON finality is ~19 blocks (SR round)
    poll_interval: 3s
    reorg_depth: 60
    min_deposit_units: "10000" # 0.01 USDT dust filter

# 专属地址布隆过滤器：进程内纯 Go 实现，启动时全量加载 user_wallet 地址。
# 区块里的收款地址先过布隆，未命中直接丢弃，命中才回 mysql 查用户。
scanner_server:
    listen: "${BLOOM_LISTEN:-:8091}" # scanner 的地址同步端口
    bloom_notify_url: "${BLOOM_NOTIFY_URL:-http://127.0.0.1:8091/internal/bloom/address}" # api 分配地址后推送给 scanner
    token: "${BLOOM_TOKEN:-}"
    notify_timeout: 3s
    sync_interval: 10s # 推送失败/scanner 重启的兜底：按 id 增量补齐
    load_batch: 5000 #
    expected_addresses: 200000 # 按地址规模预留，超出后自动翻倍重建
    false_positive_rate: 0.0001

withdraw_server:
    enabled: true
    poll_interval: 3s
    fee_limit_sun: 40000000 # 40 TRX ceiling, only spent when energy is short
    tx_expiration_sec: 60
    max_amount_units: "50000000000" # 50,000 USDT per order
    daily_max_units: "500000000000" # 500,000 USDT per day
    confirm_blocks: 19
    # 提现黑名单在数据库表 address_blacklist 中维护

sweep_server:
    enabled: true
    interval: 3600s # 归集频率：每隔多久跑一轮归集（3600秒 = 每小时一次）
    fee_limit_sun: 40000000
    tx_expiration_sec: 60 # 与节点的交易过期时间一致，用于对账判定「过期且未上链」
    max_per_round: 50
    lock_ttl: 10m
    # 能量不足（OUT_OF_ENERGY）失败后最多再重试几次，每次抬高安全系数
    # （1.15 → 1.3 → 1.5）。用完后该地址不再自动归集，只打告警日志等人工处理，
    # 避免同一个地址每轮都白烧一次手续费。
    max_energy_retries: 3
    threshold:
        # min_sweep is computed at runtime, never hard coded:
        #   cost_usd  = (energy quote + bandwidth burn) * TRX/USD
        #   min_sweep = max(cost_usd / target_cost_ratio, cost_usd * safety_multiple)
        # fixed_usdt > 0 时直接写死归集门槛，忽略上面的运行时计算：
        # 例如 100 表示余额小于 100 USDT 的钱包暂不归集
        fixed_usdt: 100
        # 归集次数：低于门槛被跳过 max_skip_rounds 次后强制归集到金融钱包，
        # 0 表示关闭（只靠 stale_days 兜底）。余额达标的钱包第一轮就归集。
        max_skip_rounds: 5
        target_cost_ratio: 0.005
        safety_multiple: 20
        min_usdt: 50
        max_usdt: 500
        refresh_interval: 10m
        trx_price_usd: 0 # 0 means read trx_price_url
        trx_price_url: "https://api.coingecko.com/api/v3/simple/price?ids=tron&vs_currencies=usd"
        stale_days: 14

energy:
    # Real comparison shopping across the enabled providers, burning TRX only
    # when every rental fails.
    mode: cheapest
    default_period: 1h
    # 租赁订单对账：Acquire 先落库再向平台下单，所以超时/进程重启会留下
    # created 状态的订单（可能已经付过钱）。reconcile_interval 是轮询周期，
    # pending_grace 之后才开始查，超过 pending_timeout 仍无法确认的订单标记
    # abandoned 并打 error 日志，需要人工和平台对账。
    reconcile_interval: 1m
    pending_grace: 2m
    pending_timeout: 30m
    providers:
        # trx_burn 是唯一不需要外部凭据的兜底方式：其他 provider 全部失败时烧 TRX。
        # 注意：提现（withdraw_server）与热钱包能量池只租不烧，租不到能量会停下来
        # 告警，不会走这个兜底；trx_burn 只对归集（sweep_server）生效。
        trx_burn:
            enabled: true
        gasstation:
            enabled: true
            options:
                base_url: https://openapi.gasstation.ai
                app_id: "${GASSTATION_APP_ID}"
                # GasStation also requires a fixed egress IP allowlist (error 100006).
                app_secret: "${GASSTATION_APP_SECRET}"
        tronenergyrent:
            enabled: true
            options:
                base_url: https://api.tronenergyrent.com
                # The key travels in the query string: make sure no proxy or access
                # log records full URLs for this host.
                api_key: "${TRONENERGYRENT_API_KEY}"
    pool:
        # ~200 withdrawals a day from one hot wallet: renting per withdrawal costs
        # 200 orders and 200 small-order surcharges, batching costs about 20.
        enabled: true
        check_interval: 30s
        low_water_txs: 3
        batch_txs: 10
        max_batch_txs: 30
        period: 1h
    auto_topup: #自动充值
        enabled: false
        source_address: "${GAS_ACCOUNT_ADDRESS}"
        gas_account:
            target_trx: 20000
            low_watermark_trx: 8000
        providers:
            gasstation:
                enabled: true
                low_watermark_trx: 2000
                target_trx: 6000
                max_single_topup_trx: 4000
                max_daily_topup_trx: 8000
                max_daily_topup_count: 3
                # Hard whitelist. The address returned by the provider API is compared
                # against this value before every transfer.
                deposit_address_url: "https://openapi.gasstation.ai" #"${GASSTATION_DEPOSIT_ADDRESS}"
            tronenergyrent:
                enabled: true
                low_watermark_trx: 2000
                target_trx: 6000
                max_single_topup_trx: 4000
                max_daily_topup_trx: 8000
                max_daily_topup_count: 3
                deposit_address_url: "https://tronenergyrent.com" #"${TRONENERGYRENT_DEPOSIT_ADDRESS}"

notify:
    # 充值到账通知走商户回调：事件按 merchant_id 投递到 merchant.callback_url，
    # 该发布器始终开启，无需在这里配置。
    #http:
    # 可选的平台级统一回调（所有商户的事件都额外 POST 到同一个地址）。
    # 默认关闭：开启但 NOTIFY_URL 指向未启动的服务时，notify_outbox.last_error
    # 里会一直是 connection refused。容器内访问宿主机服务用 host.docker.internal。
    #    enabled: false
    #    url: "${NOTIFY_URL}"
    #    secret: "${NOTIFY_SECRET}"
    #    timeout: 10s
    rocketmq:
        enabled: false
        name_server:
            - "${ROCKETMQ_NAMESRV:-127.0.0.1:9876}"
        topic: wallet_event
        group: wallet_gateway
    batch_size: 100
    poll_interval: 1s
    max_retry: 10
