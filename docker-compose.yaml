# Local / Nile stack. Secrets come from .env (see .env.example); nothing
# sensitive is committed.
#
# sign-service is deliberately on its own network with no port published to the
# host: only the workers may reach it.
services:
  mysql:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpw}
      MYSQL_DATABASE: wallet
      MYSQL_USER: wallet
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-wallet}
    ports: ["3306:3306"]
    volumes:
      - mysql-data:/var/lib/mysql
      - ./deploy/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      retries: 20
    networks: [wallet]



  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: [redis-data:/data]
    networks: [wallet]

  rocketmq-namesrv:
    image: apache/rocketmq:5.3.0
    container_name: rocketmq-namesrv
    command: sh mqnamesrv
    ports: ["9876:9876"]
    networks: [wallet]

  rocketmq-broker:
    image: apache/rocketmq:5.3.0
    container_name: rocketmq-broker
    #command: sh mqbroker -n rocketmq-namesrv:9876 --enable-proxy
    command: >
      bash -c "echo 'brokerIP1=127.0.0.1' > /tmp/broker.conf && 
               sh mqbroker -n rocketmq-namesrv:9876 -c /tmp/broker.conf --enable-proxy"
    environment:
      NAMESRV_ADDR: 127.0.0.1:9876 #rocketmq-namesrv:9876
    depends_on: [rocketmq-namesrv]
    ports: ["10911:10911", "8081:8081"]
    networks: [wallet]

  sign:
    image: wallet:v1
    entrypoint: ["/app/sign"]
    # .env is injected as environment variables instead of being mounted into
    # the container: every service then sees the same values, including the ones
    # that are not repeated below (FULLNODE_ENDPOINT, energy provider keys...).
    env_file: &env_file [.env]
    environment: &env
      CONFIG_PATH: /app/configs/config.yaml
      MYSQL_DSN: "wallet:${MYSQL_PASSWORD:-wallet}@tcp(mysql:3306)/wallet?charset=utf8mb4&parseTime=True&loc=Local"
      REDIS_ADDR: redis:6379
      SIGN_ENDPOINT: http://sign:8090
      SIGN_TOKEN: ${SIGN_TOKEN}
      WALLET_MNEMONIC: ${WALLET_MNEMONIC}
      WALLET_PASSPHRASE: ${WALLET_PASSPHRASE:-}
      API_HMAC_SECRET: ${API_HMAC_SECRET}
      NOTIFY_URL: ${NOTIFY_URL}
      NOTIFY_SECRET: ${NOTIFY_SECRET}
      HOT_WALLET_ADDRESS: ${HOT_WALLET_ADDRESS}
      FINANCE_WALLET_ADDRESS: ${FINANCE_WALLET_ADDRESS}
      GAS_ACCOUNT_ADDRESS: ${GAS_ACCOUNT_ADDRESS}
      TRONGRID_API_KEY: ${TRONGRID_API_KEY:-}
      ROCKETMQ_NAMESRV: rocketmq-namesrv:9876
      # 布隆过滤器地址同步：scanner 监听 8091，api 分配地址后推送给它。
      # 端口不对宿主机发布，只在 wallet 网络内部可达。
      BLOOM_LISTEN: ":8091"
      BLOOM_NOTIFY_URL: http://scanner:8091/internal/bloom/address
      BLOOM_TOKEN: ${BLOOM_TOKEN:-}
    depends_on:   #启动sign服务前，确保mysql服务已经启动并且健康
      mysql: {condition: service_healthy} #等待 mysql 通过健康检查
    volumes:
      # 日志落到宿主机 ./log（config 中 log_dir: ./log）。容器以 uid 10001 运行，
      # 宿主机目录需可写：mkdir -p log && chmod 777 log（否则只输出到 stdout）。
      - ./log:/app/log
    networks: [wallet]

  api:
    image: wallet:v1
    entrypoint: ["/bin/sh", "-c", "/app/api -migrate && exec /app/api"]
    env_file: *env_file
    environment: 
      <<: *env
      TZ: Asia/Shanghai
    ports: ["8080:8080"]
    depends_on: #api 会连接 rocketmq 发布 outbox 事件
      mysql: {condition: service_healthy}
      rocketmq-namesrv: {condition: service_started}
      rocketmq-broker: {condition: service_started}
    volumes:
      - ./log:/app/log
    networks: [wallet]

  scanner:
    image: wallet:v1
    entrypoint: ["/app/scanner"]
    env_file: *env_file
    environment: 
      <<: *env
      TZ: Asia/Shanghai
    depends_on: 
      #mysql: { condition: service_healthy }
      api: { condition: service_started }
    volumes:
      - ./log:/app/log
    networks: [wallet]

  withdraw:
    image: wallet:v1
    entrypoint: ["/app/withdraw"]
    env_file: *env_file
    environment: 
      <<: *env
      TZ: Asia/Shanghai
    depends_on: [api, sign] #启动withdraw服务前，确保api,sign服务已经启动
    volumes:
      - ./log:/app/log
    networks: [wallet]

  sweep:
    image: wallet:v1
    entrypoint: ["/app/sweep"]
    env_file: *env_file
    environment: 
      <<: *env
      TZ: Asia/Shanghai
    depends_on: [api, sign] #启动sweep服务前，确保api,sign服务已经启动
    volumes:
      - ./log:/app/log      
    networks: [wallet]

volumes:
  mysql-data:
  redis-data:

networks:
  wallet:
